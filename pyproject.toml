[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godotlens-mcp"
version = "1.0.1"
description = "MCP server providing 15 AI-optimized tools for GDScript code analysis via Godot's built-in LSP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Peter Zalutski"}]
keywords = ["mcp", "mcp-server", "godot", "gdscript", "lsp", "code-analysis", "code-intelligence", "semantic-analysis", "ai-agents", "claude", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
godotlens-mcp = "godotlens_mcp.server:main_sync"

[project.urls]
Homepage = "https://github.com/pzalutski-pixel/godotlens-mcp"
Repository = "https://github.com/pzalutski-pixel/godotlens-mcp"
Issues = "https://github.com/pzalutski-pixel/godotlens-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
