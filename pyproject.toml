[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godotlens-mcp"
version = "1.0.5"
description = "MCP server providing 15 AI-optimized tools for GDScript code analysis via Godot's built-in LSP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Peter Zalutski"}]
keywords = ["mcp", "mcp-server", "godot", "gdscript", "lsp", "code-analysis", "code-intelligence", "semantic-analysis", "ai-agents", "claude", "developer-tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.scripts]
godotlens-mcp = "godotlens_mcp.server:main_sync"

[project.urls]
Homepage = "https://github.com/pzalutski-pixel/godotlens-mcp"
Repository = "https://github.com/pzalutski-pixel/godotlens-mcp"
Issues = "https://github.com/pzalutski-pixel/godotlens-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No test should ever hang the suite; transport tests talk to real sockets.
timeout = 120
markers = [
    "integration: requires a real Godot binary (skipped when none is found)",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
# ASYNC matters most here: this is an asyncio codebase where a blocking call or an
# un-awaited coroutine is a real bug class. B/UP/RUF catch the rest.
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
