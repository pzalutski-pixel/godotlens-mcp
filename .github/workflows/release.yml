name: Release to PyPI, npm, and MCP Registry

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  # The tag drives npm and server.json versions, while PyPI takes its version from
  # __init__.py. Tagging v1.2.0 with __init__.py still at 1.1.0 would publish two
  # different versions under one release, so refuse before anything is uploaded.
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the package version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/godotlens_mcp/__init__.py)"
          echo "tag=$tag package=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match __version__ $pkg in src/godotlens_mcp/__init__.py"
            exit 1
          fi

  test:
    needs: verify-version
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: python -m pytest -q -m "not integration"

  publish-pypi:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        run: python -m twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bundle server into npm package
        run: |
          mkdir -p npm/server
          cp -r src/godotlens_mcp npm/server/godotlens_mcp
          # A local build would otherwise ship .pyc files alongside the source.
          find npm/server -name '__pycache__' -type d -exec rm -rf {} + 2>/dev/null || true
          # npm pack runs inside npm/, so it cannot reach the repo root. Without this
          # copy the files entry silently matches nothing and the package ships with
          # no licence at all, which Apache 2.0 sections 4(a) and 4(d) require.
          cp LICENSE NOTICE npm/

      # Six releases shipped an npm package that could not start, because nothing
      # ever executed the built artifact. Do that here, before publishing, so a
      # broken bundle fails the release instead of reaching users.
      - name: Verify the built package actually runs
        run: |
          set -euo pipefail
          cd npm && npm pack
          tarball="$(ls godotlens-mcp-*.tgz)"
          # Assert on the ARTIFACT, not on package.json's files array. v1.1.0 shipped
          # without LICENSE or NOTICE because the manifest listed them while npm pack
          # could not reach them, and a manifest-only check reported success.
          for required in package/LICENSE package/NOTICE package/README.md                           package/bin/godotlens-mcp.js package/server/godotlens_mcp/__main__.py; do
            tar -tzf "$tarball" | grep -qx "$required"               || { echo "::error::$required missing from the npm tarball"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$GITHUB_WORKSPACE/npm/$tarball"
          out="$(printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"release-check","version":"0"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | ./node_modules/.bin/godotlens-mcp)"
          echo "$out" | head -c 400
          echo "$out" | grep -q '"serverInfo"' || { echo "::error::package did not answer initialize"; exit 1; }
          echo "$out" | grep -q '"gdscript_status"' || { echo "::error::package did not answer tools/list"; exit 1; }
          rm -f "$GITHUB_WORKSPACE/npm/$tarball"

      - name: Publish to npm
        working-directory: npm
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-mcp-registry:
    needs: [publish-pypi, publish-npm]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version in server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[].version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

  github-release:
    needs: [publish-pypi, publish-npm, publish-mcp-registry]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
